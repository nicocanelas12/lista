name: Actualizador Automático de Flow

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script pasando los Secrets
        env:
          FLOW_USER: ${{ secrets.FLOW_USER }}
          FLOW_PASS: ${{ secrets.FLOW_PASS }}
        run: python actualizar.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nico/
          git diff --cached --quiet || git commit -m "auto: token de Flow renovado en lista nico"
          git push
